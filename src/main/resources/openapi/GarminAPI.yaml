openapi: 3.1.1
info:
  title: Garmin API
  description: |
    API for the Garmin Connect API to send data to the MORE platform
    **Security:** Controller need to implement CORS, to limit the requests to `api.garmin.com`
  version: '1'

servers:
  - url: /api/v1

tags:
  - name: GarminUserManagement
    description: Endpoints to receive user information from Garmin Connect

paths:
  /integrations/garmin/user:
    post:
      operationId: deleteGarminUser
      description: Delete a Garmin user
      tags:
        - GarminUserManagement
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
          description: User agent of the client making the request
        - name: garmin-client-id
          in: header
          required: false
          schema:
            type: string
          description: Garmin client identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeregistrationRequest'
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Invalid request
      security: [ ]

  /integrations/garmin/user/permissions:
    post:
      operationId: updateGarminUserPermissions
      description: Update permissions of a Garmin user
      tags:
        - GarminUserManagement
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
          description: User agent of the client making the request
        - name: garmin-client-id
          in: header
          required: false
          schema:
            type: string
          description: Garmin client identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionsRequest'
      responses:
        '200':
          description: Permissions updated successfully
        '400':
          description: Invalid request
      security: [ ]

  /integrations/garmin/summaries:
    post:
      operationId: submitSummaries
      description: Submit summaries from Garmin user (dailies, epochs, hrv, sleep, pulseox, stress)
      tags:
        - GarminUserManagement
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
          description: User agent of the client making the request
        - name: garmin-client-id
          in: header
          required: false
          schema:
            type: string
          description: Garmin client identifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummariesRequest'
      responses:
        '200':
          description: Summaries processed successfully
        '400':
          description: Invalid request
      security: [ ]

components:
  schemas:
    DeregistrationRequest:
      description: Deregistration of a Garmin user
      type: object
      properties:
        deregistrations:
          type: array
          items:
            $ref: '#/components/schemas/DeregistrationItem'

    DeregistrationItem:
      type: object
      properties:
        userId:
          type: string
          description: The unique identifier of the user to be deregistered
      required:
        - userId

    UpdatePermissionsRequest:
      description: Updated permissions of a Garmin user
      type: object
      properties:
        userPermissionsChange:
          type: array
          default: [ ]
          items:
            $ref: '#/components/schemas/UserPermissionChange'

    UserPermissionChange:
      type: object
      properties:
        userId:
          type: string
          description: The unique identifier of the user
        summaryId:
          type: string
          description: Summary identifier
        permissions:
          type: array
          items:
            type: string
          description: List of permission types
          default: [ ]
        changeTimeInSeconds:
          type: integer
          format: int64
          description: Timestamp of when the permissions changed
          default: 0
      required:
        - userId
        - summaryId


    SummariesRequest:
      type: object
      additionalProperties:
        type: array
        items:
          allOf:
            - type: object
              additionalProperties: true
      description: |
        Dynamic object where each property is an array of summary data.
        Property names can be: dailies, epochs, hrv, sleeps, pulseox, stressDetails, or any other summary type.
        Each item in the array must contain userId and can have any additional properties.
